
workflows:
  android-debug:
    name: Gabb Platformer APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Set Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Download Gradle on cloud computer
        script: |
          curl -fL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      
      - name: Build APK
        script: |
          echo "Searching for Android project..."
          find "$CM_BUILD_DIR" -name settings.gradle -type f
          SETTINGS_FILE=$(find "$CM_BUILD_DIR" -name settings.gradle -type f -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Building from: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          /tmp/gradle-8.9/bin/gradle --no-daemon assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
